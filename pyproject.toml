[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relearn-realiad"
version = "0.1.0"
description = "CSV-driven Real-IAD six-model retraining scaffold"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.23.5,<2", "Pillow>=10.4,<12"]

[project.scripts]
relearn = "relearn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
